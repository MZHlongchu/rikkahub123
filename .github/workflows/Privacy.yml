name: Build Privacy APK (Dynamic Patch)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "是否发布到 GitHub Releases"
        required: false
        default: false
        type: boolean

jobs:
  build-privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing config
        env:
          KEY_BASE64: ${{ secrets.KEY_BASE64 }}
          SIGNING_CONFIG: ${{ secrets.SIGNING_CONFIG }}
        run: |
          set -e
          echo "$KEY_BASE64" | base64 -d > app/app.jks
          echo "$SIGNING_CONFIG" > local.properties
          chmod 600 app/app.jks

      - name: Determine version
        id: version
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
            [ -n "$VERSION" ] || VERSION="0.0.0-manual"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Apply dynamic privacy patch (safe)
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("app/build.gradle.kts not found")

          s = p.read_text(encoding="utf-8")

          # 1) 禁用 Firebase/GMS 插件（仅插件声明行）
          s = re.sub(
              r'^\s*id\("com\.google\.gms\.google-services"\)\s*$',
              r'// id("com.google.gms.google-services")',
              s, flags=re.M
          )
          s = re.sub(
              r'^\s*id\("com\.google\.firebase\.crashlytics"\)\s*$',
              r'// id("com.google.firebase.crashlytics")',
              s, flags=re.M
          )

          # 2) 注释 Firebase 依赖
          firebase_dep_patterns = [
              r'^\s*implementation\(platform\(libs\.firebase\.bom\)\)\s*$',
              r'^\s*implementation\(libs\.firebase\.analytics\)\s*$',
              r'^\s*implementation\(libs\.firebase\.crashlytics\)\s*$',
              r'^\s*implementation\(libs\.firebase\.config\)\s*$',
          ]
          for pat in firebase_dep_patterns:
              s = re.sub(pat, lambda m: "// " + m.group(0).lstrip(), s, flags=re.M)

          # 3) 避免历史 patch 残留：移除 defaultConfig 下的 applicationIdSuffix
          s = re.sub(
              r'^\s*applicationIdSuffix\s*=\s*"\.privacy"\s*$',
              r'// applicationIdSuffix = ".privacy" // disabled in privacy CI',
              s, flags=re.M
          )

          # 4) 注入 BuildConfig 开关（只注入一次）
          if "DISABLE_FIREBASE_ANALYTICS" not in s:
              s = re.sub(
                  r'(defaultConfig\s*\{)',
                  r'''\1
                  buildConfigField("boolean", "DISABLE_FIREBASE_ANALYTICS", "true")
                  buildConfigField("boolean", "DISABLE_FIREBASE_CRASHLYTICS", "true")
                  buildConfigField("boolean", "DISABLE_FIREBASE_REMOTE_CONFIG", "true")
                  buildConfigField("boolean", "DISABLE_AUTO_UPDATE", "true")
          ''',
                  s, count=1
              )

          # 5) 补 Guava（避免 Mermaid.kt 的 CacheBuilder / cache unresolved）
          if 'implementation("com.google.guava:guava:' not in s:
              # 优先插到 dependencies { 内
              if re.search(r'dependencies\s*\{', s):
                  s = re.sub(
                      r'(dependencies\s*\{)',
                      r'''\1
                  implementation("com.google.guava:guava:33.2.1-android")
          ''',
                      s, count=1
                  )

          p.write_text(s, encoding="utf-8")
          print("Safe privacy patch applied.")
          PY

          echo "Patched diff (first 300 lines):"
          git diff -- . | sed -n '1,300p'

      - name: Build release APK
        run: |
          set -e
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        id: rename
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk -name "*release*.apk" | head -1)
          [ -n "$APK_PATH" ] || (echo "APK not found" && exit 1)
          DIR=$(dirname "$APK_PATH")
          NEW_APK="$DIR/rikkahub-privacy-${{ steps.version.outputs.version }}.apk"
          mv "$APK_PATH" "$NEW_APK"
          echo "apk=$NEW_APK" >> "$GITHUB_OUTPUT"
          echo "Renamed: $NEW_APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-privacy-${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab

      - name: Create Release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

      - name: Create Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: privacy-v${{ steps.version.outputs.version }}-manual
          name: Privacy Build v${{ steps.version.outputs.version }} (manual)
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          generate_release_notes: true
          draft: true

      - name: Cleanup workspace
        if: always()
        run: |
          rm -f app/app.jks local.properties app/google-services.json
          git restore --worktree --staged .
          git clean -fd
