name: Build Privacy APK (Dynamic Patch)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release:
        description: "是否发布到 GitHub Releases"
        required: false
        default: false
        type: boolean

jobs:
  build-privacy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      # 保持与你“可成功构建”的源码 workflow 一致
      - name: Prepare build files
        run: |
          set -e
          echo "${{ secrets.KEY_BASE64 }}" | base64 -d > app/app.key
          echo "${{ secrets.SIGNING_CONFIG }}" > local.properties

      - name: Apply dynamic privacy patch (compile-safe)
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path("app/build.gradle.kts")
          if not p.exists():
              raise SystemExit("app/build.gradle.kts not found")

          s = p.read_text(encoding="utf-8")

          # 只注入开关，不删除 Firebase 依赖/插件
          if "DISABLE_FIREBASE_ANALYTICS" not in s:
              s = re.sub(
                  r'(defaultConfig\s*\{)',
                  r'''\1
                  buildConfigField("boolean", "DISABLE_FIREBASE_ANALYTICS", "true")
                  buildConfigField("boolean", "DISABLE_FIREBASE_CRASHLYTICS", "true")
                  buildConfigField("boolean", "DISABLE_FIREBASE_REMOTE_CONFIG", "true")
                  buildConfigField("boolean", "DISABLE_AUTO_UPDATE", "true")
          ''',
                  s,
                  count=1
              )

          # 清理历史残留
          s = re.sub(
              r'^\s*applicationIdSuffix\s*=\s*"\.privacy"\s*$',
              r'// applicationIdSuffix = ".privacy" // disabled in privacy CI',
              s,
              flags=re.M
          )

          # Mermaid 依赖保底
          if 'implementation("com.google.guava:guava:' not in s:
              if re.search(r'dependencies\s*\{', s):
                  s = re.sub(
                      r'(dependencies\s*\{)',
                      r'''\1
                  implementation("com.google.guava:guava:33.2.1-android")
          ''',
                      s,
                      count=1
                  )

          p.write_text(s, encoding="utf-8")
          print("Compile-safe privacy patch applied.")
          PY

          echo "Patched diff (first 220 lines):"
          git diff -- . | sed -n '1,220p'

      # 继续用 dummy，避免动你原 secrets 结构
      - name: Create dummy google-services.json
        run: |
          set -e
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "privacy-build",
              "storage_bucket": "privacy-build.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.rikkahub"
                  }
                },
                "api_key": [
                  { "current_key": "DUMMY_KEY" }
                ]
              }
            ],
            "configuration_version": "1"
          }
          EOF

      - name: Determine version
        id: version
        run: |
          set -e
          if [ "${{ github.event_name }}" = "push" ]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1)
            [ -n "$VERSION" ] || VERSION="0.0.0-manual"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      # 构建命令与源码成功版保持一致
      - name: Gradle Build
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease

      - name: Rename APK
        id: rename
        run: |
          set -e
          APK_PATH=$(find app/build/outputs/apk -name "*release*.apk" | head -1)
          [ -n "$APK_PATH" ] || (echo "APK not found" && exit 1)
          DIR=$(dirname "$APK_PATH")
          NEW_APK="$DIR/rikkahub-privacy-${{ steps.version.outputs.version }}.apk"
          mv "$APK_PATH" "$NEW_APK"
          echo "apk=$NEW_APK" >> "$GITHUB_OUTPUT"
          echo "Renamed: $NEW_APK"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rikkahub-privacy-${{ steps.version.outputs.version }}
          path: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab

      - name: Create Release (tag push)
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-alpha') || contains(github.ref, '-beta') || contains(github.ref, '-rc') }}

      - name: Create Release (manual)
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: privacy-v${{ steps.version.outputs.version }}-manual
          name: Privacy Build v${{ steps.version.outputs.version }} (manual)
          files: |
            app/build/outputs/apk/**/*.apk
            app/build/outputs/bundle/**/*.aab
          generate_release_notes: true
          draft: true

      - name: Cleanup workspace
        if: always()
        run: |
          rm -f app/app.key app/app.jks local.properties app/google-services.json
          git restore --worktree --staged .
          git clean -fd
